# Image per component (current tags on public.ecr.aws).
# To upgrade a component, change its line and run ./ol-hub-docker.sh again.
# A line in install.conf wins over this file, e.g. to pin a digest:
#   IMAGE_OL_COREIQ=public.ecr.aws/openlegacy/hub/coreiq@sha256:9cc7a4e3...
# Tags are re-pushed under the same name, so ./ol-hub-docker.sh downloads every image again (PULL_IMAGES=true).

# --- always installed ---
IMAGE_POSTGRES=public.ecr.aws/docker/library/postgres:17
IMAGE_KEYCLOAK=openlegacy/openlegacy-keycloak:26.8.0
IMAGE_HUB=public.ecr.aws/openlegacy/hub/ol-hub:4.0.0-onprem
# HTTPS entry point (one address per component)
IMAGE_PROXY=public.ecr.aws/docker/library/caddy:2.10-alpine

# --- optional apps ---
IMAGE_OL_INTEGRATION=public.ecr.aws/openlegacy/hub/ol-integration:4.0.0-onprem
IMAGE_OL_TERMIQ=public.ecr.aws/openlegacy/hub/ol-termiq:1.0.6-onprem
IMAGE_OL_DATAIQ=public.ecr.aws/openlegacy/hub/ol-dataiq:1.6.8-onprem
IMAGE_OL_DATAIQ_BATCH=public.ecr.aws/openlegacy/hub/dataiq-batch:1.6.7
IMAGE_OL_APPIQ=public.ecr.aws/openlegacy/hub/appiq:1.3.7-onprem-embedded-fix
IMAGE_OL_NEXT=public.ecr.aws/openlegacy/hub/ol-next:1.8.0-onprem
IMAGE_OL_SPEC=public.ecr.aws/openlegacy/hub/olspec:1.1.8-onprem-embedded-fix2
IMAGE_OL_CODE=public.ecr.aws/openlegacy/hub/ol-code:3.0.50-onprem
IMAGE_OL_TERMINAL=public.ecr.aws/openlegacy/hub/ol-terminal:2.0.7.4-onprem
IMAGE_OL_COREIQ=public.ecr.aws/openlegacy/hub/coreiq:1.7.11-onprem
IMAGE_OL_ATOMIQ=public.ecr.aws/openlegacy/hub/atomiq:1.5.4-onprem
